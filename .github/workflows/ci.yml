name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python sources
        run: |
          python -m py_compile $(find src -name '*.py')
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.33.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'          # warn only — don't block on first scan

      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true    # partial-scan quirk; never blocks the run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
